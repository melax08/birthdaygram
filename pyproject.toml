[project]
name = "birthdaygram"
version = "1.1.0"
description = "Telegram bot for birthday reminders"
authors = [{ name = "Ilya Malashenko", email = "melax08@yandex.ru" }]
requires-python = "==3.14.4"
readme = "README.md"
license = "MIT license"

dependencies = [
    "python-dotenv==1.2.2",
    "python-telegram-bot[job-queue]==22.7",
    "sqlalchemy==2.0.49",
    "psycopg2-binary==2.9.12",
    "asyncpg==0.31.0",
    "greenlet==3.4.0",
    "pytz==2026.1.post1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.12"
]

[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM"  # flake8-simplify
]
ignore = [
    "B008",  # do not perform function calls in argument defaults
]


[tool.ruff.format]
line-ending = "lf"
