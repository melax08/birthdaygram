name: birthdaygram workflow

on: [push]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Test with ruff linter
        run: uv run ruff check .

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}

          script: |
            cd birthdaygram
            git pull
            cat <<EOF > .env
            # File generated by github actions workflow and will be recreated on a new git push
            # Telegram bot API token (get it in botfather)
            TOKEN=${{ secrets.BOT_TG_TOKEN }}
            # Additional bot settings
            RUN_SCHEDULER_HOURS=12 18
            TZ=Europe/Moscow
            # DB settings
            DB_NAME=${{ secrets.DB_NAME }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            # DONE WORKFLOW ENVS
            EOF
            docker compose -f infra/docker-compose.yml up -d --build
            yes | docker image prune --all

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.SEND_MESSAGE_TO_ID }}
          token: ${{ secrets.SEND_MESSAGE_TG_TOKEN }}
          message: 🎂 ${{ github.workflow }} успешно выполнен!
